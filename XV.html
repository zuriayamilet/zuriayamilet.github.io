<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago no cubierto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 450px;
      padding: 40px 30px;
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    p {
      margin: 0;
      font-size: 16px;
      line-height: 1.5;
      color: #666;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }

      h1 {
        font-size: 21px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="icon">⚠️</div>

    <h1>Pago no cubierto</h1>

    <p>
      No se pudo cubrir el pago correspondiente.
      Por favor, verifica tu método de pago o realiza el pago pendiente.
    </p>
  </div>

</body>
</html>
